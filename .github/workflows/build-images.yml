name: Build Docker images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, ingest]

    steps:
      - uses: actions/checkout@v6

      - name: Build ${{ matrix.image }} image
        run: |
          if [ "${{ matrix.image }}" = frontend ]; then
            docker build --build-arg REACT_APP_API_BASE_URL=/api -t frontend:ci frontend
          else
            docker build -t "${{ matrix.image }}:ci" "${{ matrix.image }}"
          fi

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push ${{ matrix.image }} image with SHA and latest tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ matrix.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          repository="peerstocks/$IMAGE"
          image="$ECR_REGISTRY/$repository"

          docker tag "$IMAGE:ci" "$image:$IMAGE_TAG"
          docker tag "$IMAGE:ci" "$image:latest"
          docker push "$image:$IMAGE_TAG"
          docker push "$image:latest"

          # ECR has one image per tag. Confirm latest moved to this SHA's digest.
          tagged_images="$(aws ecr batch-get-image \
            --repository-name "$repository" \
            --image-ids "imageTag=$IMAGE_TAG" imageTag=latest \
            --output json)"
          if ! jq -e --arg tag "$IMAGE_TAG" '
            (.failures | length) == 0 and
            ([.images[] | select(.imageId.imageTag == "latest")] | length) == 1 and
            ([.images[] | select(.imageId.imageTag == $tag)] | length) == 1 and
            ([.images[].imageId.imageDigest] | unique | length) == 1
          ' <<<"$tagged_images" >/dev/null; then
            echo "ECR tag verification failed for $repository" >&2
            exit 1
          fi
          digest="$(jq -r '.images[0].imageId.imageDigest' <<<"$tagged_images")"
          echo "$repository:latest -> $digest (same image as $IMAGE_TAG)"
